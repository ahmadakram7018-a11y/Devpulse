name: Devpulse CI Pipeline

# Trigger on push or pull request to main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Run on fresh Ubuntu machine
    runs-on: ubuntu-latest

    # PostgreSQL service container
    # Runs alongside our tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Ahmed@123
          POSTGRES_DB: clockapptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1 — Get our code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Install Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3 — Install all dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4 — Create .env file
      # Runner has no .env file — we create it with test values
      - name: Create environment file
        run: |
          echo "DATABASE_URL=postgresql://postgres:Ahmed%40123@localhost:5432/Clockapp" >> .env
          echo "SECRET_KEY=supersecrettestkey123456789012345678901234" >> .env
          echo "ALGORITHM=HS256" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
          echo "TEST_DATABASE_URL=postgresql://postgres:Ahmed%40123@localhost:5432/clockapptest" >> .env
          echo "DEBUG=True" >> .env

      # Step 5 — Run migrations on test database
      - name: Run database migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://postgres:Ahmed%40123@localhost:5432/clockapptest

      # Step 6 — Run all tests
      - name: Run tests
        run: pytest tests/ -v
